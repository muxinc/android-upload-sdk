plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
  id 'com.mux.gradle.android.mux-android-distribution'
}

android {
  namespace 'com.mux.video.upload'
  compileSdk 36

  defaultConfig {
    minSdk 23
    aarMetadata {
      minCompileSdk = 36
      minAgpVersion = '8.10.0'
    }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    consumerProguardFiles "consumer-rules.pro"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  kotlinOptions {
    jvmTarget = '1.8'
  }
  // Target only the instrumentation APK at a current API level.
  testOptions { targetSdk = 36 }

  // External fixture assets are staged outside product Git by the manual test runner.
  if (project.hasProperty("mediaFixtureAssets")) {
    sourceSets.androidTest.assets.srcDir(project.property("mediaFixtureAssets"))
  }
  buildFeatures {
    buildConfig true
  }
}

muxDistribution {
  devVersion versionFromCommitHash('dev-')
  releaseVersion versionFromTag()
  artifactIds just("upload")
  groupIds just("com.mux.video")
  publicReleaseIf releaseIfCmdFlag("publicRelease")

  packageJavadocs = true
  packageSources = true
  publishIf { it.containsIgnoreCase("release") }
  artifactoryConfig {
    contextUrl = "https://muxinc.jfrog.io/artifactory/"
    releaseRepoKey = 'default-maven-release-local'
    devRepoKey = 'default-maven-local'
  }
  dokkaConfig {
    moduleName = "Mux Upload SDK"
    footer = "(c) " + new Date().format("yyyy") + " Mux, Inc. Have questions or need help?" +
            " Contact support@mux.com"
  }
  pom {
    description "The Mux Upload SDK for Android"
    inceptionYear = "2023"
    url = "https://github.com/muxinc/android-upload-sdk"
    organization {
      name = "Mux, Inc"
      url = "https://www.mux.com"
    }
    developers {
      developer {
        email = "support@mux.com"
        name = "The player and sdks team @mux"
        organization = "Mux, inc"
      }
    }
  }
}

// Keep the Mux-owned media pipeline on one evaluated Media3 release. Consumer
// dependency resolution may upgrade it; rerun compatibility and media checks then.
def media3Version = '1.11.1'

dependencies {
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-container:$media3Version"
  implementation "androidx.media3:media3-extractor:$media3Version"
  implementation "androidx.media3:media3-effect:$media3Version"
  implementation "androidx.media3:media3-transformer:$media3Version"

  implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "io.github.crow-misia.libyuv:libyuv-android:0.43.2"

  implementation 'androidx.core:core-ktx:1.13.1'
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
  testImplementation 'androidx.test.ext:junit:1.2.1'
  testImplementation "io.mockk:mockk:1.13.9"
  testImplementation 'org.robolectric:robolectric:4.11.1'
}
